[project]
name = "ratpass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GalaxAI", email = "92019780+GalaxAI@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = [
    "openai>=3.9.0",
    "pydantic-ai-slim[openai]>=2.41.0",
    "pytest>=8",
]

[project.scripts]
ratpass = "ratpass:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in OpenAI requests using saved credentials; never run in CI"]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "ty==0.0.79",
]
